# ─────────────────────────────────────────────────────────────────────────────
#  Pipeline de PRODUCCIÓN: lo que se mergea a `main` se publica en el canal
#  `live` de Firebase Hosting.
#
#  Buscá los comentarios "TODO A?" y completalos según el enunciado.
# ─────────────────────────────────────────────────────────────────────────────
name: Deploy a producción

# A1: solo los cambios que llegan a main se publican en producción.
on:
  push:
    branches: [main]

permissions:
  contents: read

# TODO A4 (opcional): en producción NO queremos cancelar un deploy a mitad de
#                     camino, pero sí evitar dos deploys en paralelo.
#                     ¿Cómo configurás `concurrency` para eso?

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    # TODO A5 (opcional): asociá este job a un GitHub Environment llamado
    #                     `production` (permite exigir aprobación manual).
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # A2: el footer identifica el commit del push a main.
      - name: Build (export estático)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
          NEXT_PUBLIC_BUILD_REF: ${{ github.ref_name }}
          NEXT_PUBLIC_BUILD_TIME: ${{ github.event.head_commit.timestamp }}

      - name: Deploy al canal live
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          # A3: confirmar este nombre tras hosting:github; ver README.
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRACTICA_CICD_MICELA }}
          projectId: practica-cicd-micela
          channelId: live
