# ─────────────────────────────────────────────────────────────────────────────
#  Pipeline de PREVIEW: cada Pull Request se despliega en un "preview channel"
#  de Firebase Hosting (URL propia, temporal, aislada de producción).
#
#  Los comentarios TODO opcionales corresponden a A4.
#  Los previews se publican solamente para ramas de este repositorio.
# ─────────────────────────────────────────────────────────────────────────────
name: Preview en Pull Request

# A1: cada apertura o actualización de un PR prepara su preview.
on:
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write # la action comenta la URL del preview en el PR

# TODO A4 (opcional): agregá un bloque `concurrency` para que, si se pushea dos
#                     veces seguidas al mismo PR, se cancele el build anterior.

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # A2: el footer identifica exactamente el commit compilado del PR.
      - name: Build (export estático)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_BUILD_SHA: ${{ github.event.pull_request.head.sha }}
          NEXT_PUBLIC_BUILD_REF: ${{ github.head_ref }}
          NEXT_PUBLIC_BUILD_TIME: ${{ github.event.pull_request.updated_at }}

      - name: Deploy a preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          # A3: confirmar este nombre tras hosting:github; ver README.
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PRACTICA_CICD_MICELA }}
          projectId: practica-cicd-micela
          expires: 3d
